name: Velri-lib integration
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  library-boundary:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - name: Install C23 compiler
        run: sudo apt-get update && sudo apt-get install -y clang-18
      - name: Configure pinned library and engine consumer
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=clang-18 -DCMAKE_C_FLAGS=-Werror
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
      - name: Install library package
        run: cmake --install build/velri-lib --prefix "$RUNNER_TEMP/velri-lib-install"
      - name: Build engine against installed package
        run: >-
          cmake -S . -B build-package -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=clang-18 -DVELRI_LIB_SOURCE_DIR=
          -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/velri-lib-install"
      - run: cmake --build build-package --parallel 2
      - run: ctest --test-dir build-package --output-on-failure
