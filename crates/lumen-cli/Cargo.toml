[package]
name = "lumen-cli"
description = "The lumen binary: run, chat, serve, inspect, bench, probe, pack, quantize."
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "lumen"
path = "src/main.rs"

[dependencies]
lumen-core.workspace = true
lumen-config.workspace = true
lumen-engine.workspace = true
lumen-quantize.workspace = true
lumen-chat.workspace = true
lumen-server = { workspace = true, optional = true }
clap.workspace = true
serde_json.workspace = true

[features]
default = ["server"]
cuda = ["lumen-engine/cuda"]
server = ["dep:lumen-server"]
