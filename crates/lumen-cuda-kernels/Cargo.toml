[package]
name = "lumen-cuda-kernels"
description = "CUDA C++ kernels (.cu), their extern \"C\" launchers and raw driver API bindings (bindgen over cuda.h): LTQ GEMV and GEMM, mgemm, reconstruct + GEMM on CUTLASS, Hadamard-256, row decoding, attention on FlashInfer, DeltaNet, norms, router, sampling; quantizer Viterbi and LDLQ steps. build.rs compiles them with nvcc into a static library."
version.workspace = true
edition.workspace = true
rust-version.workspace = true

# Kernels share parameter structs with the host through lumen-kabi (lumen_kabi.h generated by cbindgen).
# build.rs (nvcc, CUTLASS and FlashInfer submodules, bindgen over cuda.h) is added together with the first kernel.
[dependencies]
lumen-kabi.workspace = true
